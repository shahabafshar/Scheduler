services:
  scheduler:
    build: .
    container_name: phd-scheduler
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    networks:
      - npm_default

networks:
  npm_default:
    external: true
